name: Perfect Snake tests

on:
  push:
    paths: ['perfect/**', 'tests/**', '.github/workflows/perfect-snake-tests.yml']
  pull_request:
    paths: ['perfect/**', 'tests/**', '.github/workflows/perfect-snake-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/perfect-engine.test.js 100
